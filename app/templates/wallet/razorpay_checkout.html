{% extends 'base.html' %}

{% block title %}Secure Checkout — SkillSwap{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border p-5 bg-white shadow-sm">
        <div class="spinner-border text-dark mx-auto mb-3" role="status" style="width: 2.2rem; height: 2.2rem;"></div>
        <h5 class="fw-bold text-dark mb-1">Initializing Secure Checkout...</h5>
        <p class="text-muted small mb-4">Please complete the payment in the Razorpay gateway window.</p>

        <!-- Form for callback submission -->
        <form id="razorpay-form" method="POST" action="{{ url_for('wallet.razorpay_callback') }}">
          <input type="hidden" name="razorpay_order_id" id="rzp_order_id">
          <input type="hidden" name="razorpay_payment_id" id="rzp_payment_id">
          <input type="hidden" name="razorpay_signature" id="rzp_signature">
          <input type="hidden" name="payment_ref" value="{{ order.payment_ref }}">
        </form>

        <button id="btn-manual-rzp" class="btn btn-outline-secondary btn-sm">
          Click to re-open payment modal
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const options = {
    key: "{{ order.key_id }}",
    amount: "{{ order.amount_paise }}",
    currency: "INR",
    name: "SkillSwap",
    description: "{{ order.credits }} Credits Package Top-Up",
    order_id: "{{ order.order_id }}",
    handler: function (response) {
      document.getElementById('rzp_order_id').value = response.razorpay_order_id;
      document.getElementById('rzp_payment_id').value = response.razorpay_payment_id;
      document.getElementById('rzp_signature').value = response.razorpay_signature;
      document.getElementById('razorpay-form').submit();
    },
    prefill: {
      name: "{{ current_user.name }}",
      email: "{{ current_user.email }}",
      contact: "{{ current_user.phone or '' }}"
    },
    theme: {
      color: "#0f172a"
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();

  document.getElementById('btn-manual-rzp').addEventListener('click', () => {
    rzp.open();
  });
});
</script>
{% endblock %}
